name: research-controls
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned independent Buddie
        run: python -m pip install -r requirements.txt
      - name: Integration and tamper tests
        run: python -m unittest discover -s tests -v
      - name: Execute fresh controls
        run: python -m agency run --output build/E000-ci
      - name: Replay fresh evidence
        run: python -m agency check build/E000-ci
      - name: Replay committed evidence
        run: python -m agency check results/E000-bootstrap
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: E000-${{ matrix.os }}-py${{ matrix.python }}
          path: build/E000-ci/
          if-no-files-found: warn
